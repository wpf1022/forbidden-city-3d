<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>紫禁城 · 三维复原 | Forbidden City in 3D</title>
<meta name="description" content="基于 Three.js 程序化建模的紫禁城中轴线三维复原：太和殿、中和殿、保和殿、金水桥。" />
<link rel="stylesheet" href="./css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>

  <!-- 加载遮罩 -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-title">紫禁城</div>
      <div class="loader-sub">正在营建…</div>
    </div>
  </div>

  <!-- 界面 -->
  <header id="hud-top">
    <h1>紫禁城<span>·</span>中轴</h1>
    <p>太和殿 · 中和殿 · 保和殿 · 金水桥</p>
  </header>

  <nav id="hud-panel">
    <button data-action="rotate" class="on">自动环绕</button>
    <button data-action="night">夜景</button>
    <button data-action="reset">重置视角</button>
    <button data-action="labels" class="on">建筑标注</button>
  </nav>

  <footer id="hud-foot">
    <span>拖拽旋转 · 滚轮缩放 · 右键平移</span>
    <span id="stat"></span>
  </footer>

  <!-- 错误浮层：任何脚本异常都会显示在这里，便于排查 -->
  <div id="errbox"></div>

  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('errbox');
      box.style.display = 'block';
      box.textContent = '脚本错误: ' + (e.message || e.type);
    });
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
